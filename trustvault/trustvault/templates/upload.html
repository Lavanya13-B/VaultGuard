{% extends "base.html" %}{% block body %}<div class="card" style="max-width:520px"><h1>Upload a document</h1>
<form method="post" enctype="multipart/form-data" class="row" style="flex-direction:column;align-items:stretch"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>File (pdf, png, jpg, txt, csv, docx, xlsx; max 10 MB)<input type="file" name="file" required></label>
<label>Display name (optional)<input name="name" maxlength="120"></label>
<label>Category<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label>
<button>Encrypt &amp; upload</button></form>
<p class="mute">The file's real content is checked, not just its extension. It is encrypted before it touches disk. Only you can see it until you share it.</p></div>{% endblock %}
