{% extends "base.html" %}{% block body %}<div class="card" style="max-width:420px"><h1>Change password</h1>
<form method="post" class="row" style="flex-direction:column;align-items:stretch"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Current password<input type="password" name="current" required autocomplete="current-password"></label>
<label>New password (12+ characters)<input type="password" name="new" required minlength="12" autocomplete="new-password"></label>
<button>Change password</button></form></div>{% endblock %}
